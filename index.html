<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>📝 My To-Do List</h1>
    <p class="subtitle">Plan your day, one task at a time.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Enter a task..." autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>
    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty-message">No tasks yet. Add your first task! ✨</p>
    <button id="clear-completed" class="secondary" type="button">Clear Completed</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
